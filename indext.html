<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video</title>
    <style>
        :root {
            --bg: #000000;
            --ui-panel: rgba(15, 15, 15, 0.85);
            --accent: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--accent);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* The Mirror Art */
        #ascii-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Vertical Navigation Bar (Right) */
        .side-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--ui-panel);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 40px;
            border: 1px solid var(--border);
            transition: opacity 0.4s, transform 0.4s;
        }

        .side-nav.hidden {
            opacity: 0;
            transform: translateY(-50%) translateX(100px);
        }

        /* Action Buttons */
        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            flex-direction: column;
            gap: 2px;
        }

        .action-btn:hover {
            background: var(--accent);
            color: black;
        }

        .action-btn.active {
            background: var(--accent);
            color: black;
        }

        /* Settings Drawer (Slides from Right) */
        .settings-drawer {
            position: fixed;
            right: -350px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: var(--ui-panel);
            backdrop-filter: blur(30px);
            z-index: 999;
            padding: 40px 25px;
            border-left: 1px solid var(--border);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .settings-drawer.open {
            right: 0;
        }

        .drawer-header {
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: white;
            cursor: pointer;
        }

        /* Style Chips */
        .style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .chip {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip:hover, .chip.active {
            background: white;
            color: black;
        }

        /* Branding */
        .logo {
            position: fixed;
            top: 30px;
            left: 30px;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Internal Processing Elements */
        #video, #buffer { display: none; }
    </style>
</head>
<body>

    <div class="logo">ASCII Video</div>

    <canvas id="ascii-canvas"></canvas>

    <!-- Side Navigation Bar -->
    <nav class="side-nav" id="side-nav">
        <button id="start-btn" class="action-btn" title="Start Camera">
            <span style="font-size: 18px;">Camera</span>
        </button>
        <button id="refine-btn" class="action-btn" title="Refine Look">
            <span>SET</span>
        </button>
        <button id="capture-btn" class="action-btn" title="Save Frame">
            <span>SNAP</span>
        </button>
        <button id="fs-btn" class="action-btn" title="Fullscreen">
            <span>FULL</span>
        </button>
    </nav>

    <!-- Settings Drawer -->
    <div class="settings-drawer" id="drawer">
        <div class="drawer-header">Refine Design</div>
        
        <div class="control-group">
            <label id="lbl-detail">Detail Level: High</label>
            <input type="range" id="res-slider" min="0.05" max="0.35" step="0.01" value="0.15">
        </div>

        <div class="control-group">
            <label id="lbl-pop">Contrast (Pop): 1.2x</label>
            <input type="range" id="contrast-slider" min="0.5" max="3.0" step="0.1" value="1.2">
        </div>

        <div class="control-group">
            <label>Character Set</label>
            <div class="style-grid">
                <div class="chip active" onclick="setChars('pro')">Elite</div>
                <div class="chip" onclick="setChars('minimal')">Soft</div>
                <div class="chip" onclick="setChars('binary')">Binary</div>
                <div class="chip" onclick="setChars('math')">Theory</div>
                <div class="chip" onclick="setChars('blocks')">Solid</div>
                <div class="chip" onclick="setChars('dots')">Stipple</div>
            </div>
        </div>

        <div class="control-group">
            <button id="invert-btn" class="chip" style="width: 100%;">Invert Black/White</button>
        </div>

        <div style="margin-top: auto; opacity: 0.3; font-size: 9px; text-transform: uppercase; letter-spacing: 2px;">
            Elite ASCII Engine v4.0
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="buffer"></canvas>

    <script>
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const video = document.getElementById('video');
        const buffer = document.getElementById('buffer');
        const bCtx = buffer.getContext('2d', { willReadFrequently: true });
        
        // --- State Management ---
        const state = {
            res: 0.15,
            contrast: 1.2,
            inverted: false,
            chars: "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^' . ".split("").reverse()
        };

        const charSets = {
            pro: "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^' . ".split("").reverse(),
            minimal: " .:-=+*#%@".split(""),
            binary: "01 ".split(""),
            math: "∞∑π∆∫√≈≠≡ ".split(""),
            blocks: " ░▒▓█".split(""),
            dots: " .·°ºO".split("")
        };

        // --- UI Interactions ---
        const nav = document.getElementById('side-nav');
        const drawer = document.getElementById('drawer');
        const startBtn = document.getElementById('start-btn');
        let uiTimer;

        function wakeUI() {
            nav.classList.remove('hidden');
            clearTimeout(uiTimer);
            uiTimer = setTimeout(() => {
                if (!drawer.classList.contains('open')) nav.classList.add('hidden');
            }, 5000);
        }

        window.addEventListener('mousemove', wakeUI);
        window.addEventListener('touchstart', wakeUI);

        document.getElementById('refine-btn').onclick = () => {
            drawer.classList.toggle('open');
            document.getElementById('refine-btn').classList.toggle('active');
        };

        function setChars(key) {
            state.chars = charSets[key];
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- Camera & Rendering ---
        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: false 
                });
                video.srcObject = stream;
                startBtn.style.opacity = '0.3';
                startBtn.pointerEvents = 'none';
                render();
            } catch (e) { alert("Camera Error: Please allow access."); }
        };

        document.getElementById('res-slider').oninput = (e) => {
            state.res = parseFloat(e.target.value);
            document.getElementById('lbl-detail').innerText = `Detail Level: ${state.res > 0.25 ? 'Ultra' : 'High'}`;
        };

        document.getElementById('contrast-slider').oninput = (e) => {
            state.contrast = parseFloat(e.target.value);
            document.getElementById('lbl-pop').innerText = `Contrast (Pop): ${state.contrast.toFixed(1)}x`;
        };

        document.getElementById('invert-btn').onclick = () => state.inverted = !state.inverted;

        document.getElementById('capture-btn').onclick = () => {
            const link = document.createElement('a');
            link.download = `ascii-elite-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };

        document.getElementById('fs-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        function render() {
            const w = video.videoWidth * state.res;
            const h = video.videoHeight * state.res;

            if (w > 0) {
                if (buffer.width !== w) {
                    buffer.width = w;
                    buffer.height = h;
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }

                // Step 1: Process Mirror Image
                bCtx.save();
                bCtx.translate(w, 0);
                bCtx.scale(-1, 1);
                bCtx.drawImage(video, 0, 0, w, h);
                bCtx.restore();

                const pixels = bCtx.getImageData(0, 0, w, h).data;

                // Step 2: Clear Canvas
                ctx.fillStyle = state.inverted ? "white" : "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Step 3: Draw ASCII
                ctx.fillStyle = state.inverted ? "black" : "white";
                const charW = canvas.width / w;
                const charH = canvas.height / h;
                ctx.font = `bold ${charH * 1.15}px monospace`;
                ctx.textAlign = "center";

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        // Light calculation
                        let brightness = (0.2126 * pixels[i] + 0.7152 * pixels[i+1] + 0.0722 * pixels[i+2]);
                        
                        // Contrast calculation
                        brightness = ((brightness - 128) * state.contrast) + 128;
                        brightness = Math.max(0, Math.min(255, brightness));

                        const charIdx = Math.floor((brightness / 255) * (state.chars.length - 1));
                        const char = state.chars[charIdx] || " ";
                        
                        ctx.fillText(char, x * charW + charW/2, y * charH + charH);
                    }
                }
            }
            requestAnimationFrame(render);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
